apiVersion: v1
kind: ConfigMap
metadata:
  name: beep-backend-config
  namespace: beep-ai-service-desk
data:
  ENVIRONMENT: "production"
  API_V1_PREFIX: "/api/v1"
  PUBLIC_BASE_URL: "https://operacoes-playground.internal.beepsaude.com.br"
  DATABASE_URL: "postgresql+asyncpg://beep:beep@postgres:5432/beep_service_desk"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "beep_knowledge_base"
  EMBEDDING_DIM: "1536"
  AUTH_PROVIDER: "keycloak"
  OIDC_ISSUER: "https://sso.beepsaude.com.br/realms/beep"
  OIDC_CLIENT_ID: "beep-ai-service-desk"
  OIDC_REDIRECT_URI: "https://operacoes-playground.internal.beepsaude.com.br/api/v1/auth/callback"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  DEFAULT_LLM_PROVIDER: "anthropic"
  ANTHROPIC_MODEL: "claude-sonnet-5"
  OPENAI_MODEL: "gpt-4o"
  EMBEDDING_PROVIDER: "openai"
  EMBEDDING_MODEL: "text-embedding-3-small"
  CONFIDENCE_THRESHOLD_AUTO: "0.85"
  CONFIDENCE_THRESHOLD_SUGGEST: "0.60"
  RAG_TOP_K: "6"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET: "beep-service-desk"
  CORS_ORIGINS: '["https://operacoes-playground.internal.beepsaude.com.br"]'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beep-frontend-config
  namespace: beep-ai-service-desk
data:
  NEXT_PUBLIC_API_BASE_URL: "https://operacoes-playground.internal.beepsaude.com.br/api/v1"
  NEXT_PUBLIC_APP_NAME: "BEEP AI Service Desk"
