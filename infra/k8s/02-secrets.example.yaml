# Modelo de Secret — NÃO commitar valores reais.
# Preencher via pipeline de CI/CD (ex.: sealed-secrets, external-secrets, ou `kubectl create secret`
# a partir de um vault corporativo) e nunca versionar este arquivo com dados reais preenchidos.
apiVersion: v1
kind: Secret
metadata:
  name: beep-backend-secrets
  namespace: beep-ai-service-desk
type: Opaque
stringData:
  DATABASE_PASSWORD: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"
  OIDC_CLIENT_SECRET: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  QDRANT_API_KEY: "REPLACE_ME"
---
# Conteúdo do JSON da conta de serviço do Google (Drive API), montado como
# arquivo em /etc/google/service-account.json nos pods worker e beat. Só é
# necessário quando GOOGLE_DRIVE_SYNC_ENABLED=true no ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: beep-google-drive-secrets
  namespace: beep-ai-service-desk
type: Opaque
stringData:
  service-account.json: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: beep-postgres-secrets
  namespace: beep-ai-service-desk
type: Opaque
stringData:
  POSTGRES_USER: "beep"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "beep_service_desk"
