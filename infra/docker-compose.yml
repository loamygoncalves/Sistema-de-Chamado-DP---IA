name: beep-ai-service-desk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beep
      POSTGRES_PASSWORD: beep
      POSTGRES_DB: beep_service_desk
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./.data/qdrant:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../backend:/app
      # Pasta local/de rede lida pela sincronização automática da base de
      # conhecimento (LOCAL_KNOWLEDGE_FOLDER=/data/knowledge-base no .env).
      # Aponte LOCAL_KNOWLEDGE_FOLDER_HOST_PATH para o caminho real da pasta
      # compartilhada no host — ver docs/LOCAL_KNOWLEDGE_SETUP.md.
      - ${LOCAL_KNOWLEDGE_FOLDER_HOST_PATH:-./knowledge-base}:/data/knowledge-base:ro

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    env_file: ../.env
    depends_on:
      - backend
      - redis
    volumes:
      - ../backend:/app
      - ${LOCAL_KNOWLEDGE_FOLDER_HOST_PATH:-./knowledge-base}:/data/knowledge-base:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: "BEEP AI Service Desk"
    depends_on:
      - backend
    ports:
      - "3000:3000"

networks:
  default:
    name: beep-ai-service-desk
