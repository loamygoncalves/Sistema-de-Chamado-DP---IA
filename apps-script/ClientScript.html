<script>
(function () {
  'use strict';

  /* ============================================================
     Ponte com o servidor — envolve google.script.run numa Promise
     para o resto do código poder usar async/await.
     ============================================================ */
  function call(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); });
      runner[fnName].apply(runner, args);
    });
  }

  function errorMessage(e) { return (e && e.message) ? e.message : String(e); }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === null || attrs[k] === undefined) return;
      if (k === 'class') e.className = attrs[k];
      else if (k === 'onclick' || k === 'onchange' || k === 'oninput' || k === 'onsubmit') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c !== null && c !== undefined) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  function readFileAsBase64_(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result).split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /** Placeholders cinza com brilho (ver .skeleton em Styles.html), no
   * formato aproximado do que vai aparecer ali — usados nos momentos de
   * espera (lista de chamados, detalhe, dashboard) em vez de um texto
   * "Carregando..." parado ou, pior, nada na tela. */
  function skeletonTicketRows_(count) {
    var wrap = el('div', { class: 'stack' });
    for (var i = 0; i < count; i++) {
      wrap.appendChild(el('div', { class: 'card skeleton-row' }, [
        el('div', { class: 'skeleton', style: 'height:14px; width:' + (50 + (i % 3) * 13) + '%;' }, []),
        el('div', { class: 'skeleton', style: 'height:11px; width:32%;' }, [])
      ]));
    }
    return wrap;
  }

  function skeletonTicketDetail_() {
    var wrap = el('div', {});
    wrap.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'skeleton', style: 'height:11px; width:110px; margin-bottom:8px;' }, []),
      el('div', { class: 'skeleton', style: 'height:19px; width:55%; margin-bottom:6px;' }, []),
      el('div', { class: 'skeleton', style: 'height:11px; width:38%;' }, [])
    ]));
    wrap.appendChild(el('div', { class: 'grid-2' }, [
      el('div', { class: 'skeleton', style: 'height:220px; border-radius:var(--radius);' }, []),
      el('div', { class: 'stack' }, [
        el('div', { class: 'skeleton', style: 'height:100px; border-radius:var(--radius);' }, []),
        el('div', { class: 'skeleton', style: 'height:80px; border-radius:var(--radius);' }, [])
      ])
    ]));
    return wrap;
  }

  function skeletonDashboard_() {
    var wrap = el('div', {});
    wrap.appendChild(el('div', { class: 'stat-grid' }, [
      el('div', { class: 'skeleton skeleton-stat' }, []),
      el('div', { class: 'skeleton skeleton-stat' }, []),
      el('div', { class: 'skeleton skeleton-stat' }, [])
    ]));
    wrap.appendChild(el('div', { class: 'skeleton', style: 'height:180px; border-radius:var(--radius); margin-bottom:14px;' }, []));
    wrap.appendChild(el('div', { class: 'skeleton', style: 'height:180px; border-radius:var(--radius);' }, []));
    return wrap;
  }

  function formatDate_(d) {
    var date = new Date(d);
    if (isNaN(date.getTime())) return String(d);
    return date.toLocaleString('pt-BR');
  }

  var STATUS_LABEL = { em_triagem: 'Em triagem', em_atendimento: 'Em atendimento', aguardando_usuario: 'Aguardando usuário', resolvido: 'Resolvido', encerrado: 'Encerrado' };
  var STATUS_CLASS = { em_triagem: 'brand', em_atendimento: 'warning', aguardando_usuario: 'warning', resolvido: 'success', encerrado: 'neutral' };
  var PRIORITY_LABEL = { baixa: 'Baixa', media: 'Média', alta: 'Alta', critica: 'Crítica' };
  var PRIORITY_CLASS = { baixa: 'neutral', media: 'brand', alta: 'warning', critica: 'critical' };

  function slaState_(t) {
    if (!t.slaDueAt || t.status === 'resolvido' || t.status === 'encerrado') return 'neutral';
    var diffH = (new Date(t.slaDueAt) - new Date()) / 3600000;
    if (diffH < 0) return 'critical';
    if (diffH <= 6) return 'warning';
    return 'success';
  }

  function slaLabel_(t) {
    if (!t.slaDueAt || t.status === 'resolvido' || t.status === 'encerrado') return '—';
    var diffMs = new Date(t.slaDueAt) - new Date();
    if (diffMs < 0) return 'vencido';
    return Math.round(diffMs / 3600000) + 'h restantes';
  }

  var SLA_STATE_COLOR_ = { success: 'var(--success)', warning: 'var(--warning)', critical: 'var(--critical)' };
  var SLA_STATE_TINT_ = { success: 'var(--success-tint)', warning: 'var(--warning-tint)', critical: 'var(--critical-tint)' };
  var SLA_STATE_INK_ = { success: 'var(--success-ink)', warning: 'var(--warning-ink)', critical: 'var(--critical-ink)' };

  /** % do prazo já consumido (aberto até agora, sobre aberto até o
   * vencimento) + barrinha de preenchimento colorida — null quando não
   * tem prazo ou o chamado já foi resolvido/encerrado (SLA parou de
   * correr, não faz sentido mostrar barra). */
  function slaProgress_(t) {
    var sState = slaState_(t);
    if (!t.slaDueAt || sState === 'neutral') return null;
    var opened = new Date(t.openedAt).getTime();
    var due = new Date(t.slaDueAt).getTime();
    var total = due - opened;
    var pct = sState === 'critical' ? 100 : Math.max(0, Math.min(100, total > 0 ? Math.round(((Date.now() - opened) / total) * 100) : 100));
    // Largura fixa (não flex:1) de propósito: isto fica encostado no
    // canto direito do card, então não deve esticar pra ocupar o espaço
    // todo — só o badge + uma barrinha curta.
    return el('div', { style: 'display:flex; align-items:center; gap:6px; flex-shrink:0;' }, [
      el('span', {
        style: 'font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; min-width:38px; text-align:center;' +
          'background:' + SLA_STATE_TINT_[sState] + '; color:' + SLA_STATE_INK_[sState] + ';'
      }, [pct + '%']),
      el('div', { style: 'width:56px; height:6px; border-radius:999px; background:var(--line); overflow:hidden;' }, [
        el('div', { style: 'height:100%; width:' + pct + '%; background:' + SLA_STATE_COLOR_[sState] + ';' }, [])
      ])
    ]);
  }

  /** Data por extenso + frase relativa de urgência ("Irá expirar em Xh e
   * Ymin" / "Expirou há Xh e Ymin") — só quando faz sentido mostrar
   * urgência: perto o bastante do prazo (até 24h) ou já vencido. Chamado
   * resolvido/encerrado mostra só a data, sem a frase (o prazo parou de
   * importar). */
  function formatDeadline_(iso, opts) {
    opts = opts || {};
    if (!iso) return el('span', { style: 'font-size:12.5px; color:var(--ink-soft);' }, ['—']);
    var diffMin = Math.round((new Date(iso) - new Date()) / 60000);
    var vencido = diffMin < 0;
    var dateNode = el('span', {
      style: 'font-size:12.5px;' + (vencido && !opts.done ? ' color:var(--critical-ink); text-decoration:underline;' : ' color:var(--ink);')
    }, [formatDate_(iso)]);
    var wrap = el('div', {}, [dateNode]);
    if (opts.done) return wrap;
    var absMin = Math.abs(diffMin);
    var h = Math.floor(absMin / 60), m = absMin % 60;
    var duracao = (h > 0 ? h + ' h e ' : '') + m + ' min';
    if (vencido) {
      wrap.appendChild(el('div', { style: 'font-size:11px; font-weight:600; color:var(--critical-ink);' }, ['Expirou há ' + duracao]));
    } else if (diffMin <= 24 * 60) {
      wrap.appendChild(el('div', { style: 'font-size:11px; font-weight:600; color:var(--warning-ink);' }, ['Irá expirar em ' + duracao]));
    }
    return wrap;
  }

  /** Iniciais pro avatar do solicitante (primeiro + último nome). */
  function initials_(name) {
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '?';
    var first = parts[0].charAt(0);
    var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
    return (first + last).toUpperCase();
  }

  function ticketRow_(t, onClick) {
    var sState = slaState_(t);
    var progress = slaProgress_(t);
    return el('div', { class: 'card ticket-row' + (sState === 'critical' ? ' overdue' : ''), onclick: onClick }, [
      el('div', { class: 'top-line' }, [
        el('span', { class: 'mono', style: 'font-size:11.5px; color:var(--ink-soft);' }, [t.protocol]),
        // Categoria em destaque (pill própria, mesmo peso visual de
        // prioridade/status) — antes era um texto pequeno perdido no meio
        // da linha de meta-dados, fácil de passar batido.
        el('span', { class: 'pill brand' }, [t.department]),
        el('span', { class: 'pill ' + PRIORITY_CLASS[t.priority] }, [PRIORITY_LABEL[t.priority] || t.priority]),
        el('span', { class: 'pill ' + STATUS_CLASS[t.status] }, [STATUS_LABEL[t.status] || t.status])
      ]),
      el('div', { class: 'subject' }, [t.subject]),
      el('div', { class: 'meta' }, [
        'Colaborador: ', el('b', { style: 'color:var(--ink);' }, [t.requesterName]),
        el('span', { style: 'margin:0 6px;' }, ['·']),
        t.assignedTo
          ? el('span', {}, ['Analista: ', el('b', { style: 'color:var(--brand-ink);' }, [t.assignedToName || t.assignedTo])])
          : el('span', { style: 'font-style:italic;' }, ['sem analista vinculado'])
      ]),
      // Deadline (à esquerda) + SLA %/barrinha (à direita, sempre no
      // canto) — os dois só existem juntos: progress vem null nos
      // mesmos casos em que não faz sentido mostrar prazo (sem
      // slaDueAt, ou chamado resolvido/encerrado).
      progress ? el('div', { class: 'ticket-row-footer' }, [
        formatDeadline_(t.slaDueAt, {}),
        progress
      ]) : null
    ]);
  }

  /* ============================================================
     Estado global do cliente
     ============================================================ */
  var state = {
    user: null,
    departments: [],
    view: 'chat',
    messages: [],
    ticketForm: null,
    analystView: { mode: 'inbox', status: '', overdue: false, pending: false, q: '' }
  };

  /** Histórico da conversa (turnos de verdade, {role, content}) até a
   * mensagem `beforeMessage` — ou a conversa inteira se omitido. Usado para
   * a IA responder considerando o que já foi dito, não cada pergunta como
   * se fosse a primeira. */
  function conversationHistory_(beforeMessage) {
    var messages = state.messages;
    if (beforeMessage) {
      var idx = messages.indexOf(beforeMessage);
      if (idx !== -1) {
        // Recua até o turno do usuário que gerou esta resposta, pra devolver
        // só o que veio ANTES dele (a pergunta atual vai separada).
        var userIdx = idx;
        while (userIdx > 0 && messages[userIdx].role !== 'user') userIdx--;
        messages = messages.slice(0, userIdx);
      }
    }
    return messages
      .filter(function (m) { return (m.role === 'user' || m.role === 'assistant') && m.content; })
      .map(function (m) { return { role: m.role, content: m.content }; });
  }

  async function boot() {
    try {
      state.user = await call('getCurrentUser');
      state.departments = await call('getDepartments');
    } catch (e) {
      document.getElementById('view').innerHTML = '';
      document.getElementById('view').appendChild(el('div', { class: 'card' }, ['Erro ao carregar o BEEP Service Desk: ' + errorMessage(e)]));
      return;
    }
    renderAfterLogin_();
  }

  /** Usa o `state.user` que já está em mãos (de boot() ou de um CPF
   * recém-confirmado) para decidir a tela — sem buscar de novo no servidor.
   * Buscar de novo aqui já causou uma tela presa na confirmação de CPF
   * mesmo com o CPF certo (a segunda consulta não tem nenhuma vantagem
   * sobre o resultado que verifyCpf acabou de devolver, e só criava um
   * ponto a mais de poder dar errado). */
  function renderAfterLogin_() {
    document.getElementById('userName').textContent = state.user.name;
    document.getElementById('userEmail').textContent = state.user.email || '(conta sem e-mail detectado)';
    document.getElementById('userRole').textContent = state.user.role === 'analyst' ? 'Analista' : 'Colaborador';

    // Colaborador sem e-mail de conta Google cadastrado (nem toda conta é
    // @beepsaude) precisa confirmar o CPF antes de usar o sistema — é
    // essa checagem contra a aba Colaboradores (importada da ADP, só
    // gente ativa) que também tira o acesso de quem foi desligado.
    if (state.user.role === 'employee' && !state.user.verified) {
      document.getElementById('tabs').innerHTML = '';
      renderVerifyGate(document.getElementById('view'));
      return;
    }

    buildTabs();
    setView(state.user.role === 'analyst' ? 'analyst' : 'chat');
  }

  function renderVerifyGate(root) {
    root.innerHTML = '';
    var input = el('input', { type: 'text', inputmode: 'numeric', placeholder: 'Seu CPF (só números)', style: 'max-width:220px;' });
    var msg = el('p', { style: 'font-size:12.5px; color:var(--ink-soft); min-height:16px;' }, []);
    var btn = el('button', {
      class: 'btn primary', onclick: async function () {
        var cpf = input.value.trim();
        if (!cpf) { msg.textContent = 'Informe seu CPF.'; return; }
        btn.setAttribute('disabled', 'disabled');
        msg.textContent = 'Confirmando...';
        try {
          state.user = await call('verifyCpf', cpf);
          renderAfterLogin_();
        } catch (e) {
          msg.textContent = errorMessage(e);
          btn.removeAttribute('disabled');
        }
      }
    }, ['Confirmar']);
    root.appendChild(el('div', { class: 'card', style: 'max-width:420px; margin:32px auto;' }, [
      el('h2', { style: 'margin:0 0 8px; font-size:16px;' }, ['Confirme seu CPF']),
      el('p', { style: 'font-size:13px; color:var(--ink-soft); margin:0 0 14px;' },
        ['Não encontramos sua conta Google na nossa lista de colaboradores ativos. Informe seu CPF para confirmar quem você é — é só na primeira vez, com esta conta Google.']),
      el('div', { style: 'display:flex; gap:8px; align-items:center;' }, [input, btn]),
      msg
    ]));
  }

  function buildTabs() {
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    var items = [{ id: 'chat', label: 'Perguntar à IA' }];
    if (state.user.role === 'employee') items.push({ id: 'tickets', label: 'Meus chamados' });
    if (state.user.role === 'analyst') {
      items.push({ id: 'analyst', label: 'Fila do analista' });
      items.push({ id: 'dashboard', label: 'Dashboard' });
    }
    items.forEach(function (t) {
      var btn = el('button', { onclick: function () { setView(t.id); } }, [t.label]);
      btn.dataset.view = t.id;
      tabs.appendChild(btn);
    });
  }

  function setView(view) {
    state.view = view;
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.view === view); });
    var root = document.getElementById('view');
    root.innerHTML = '';
    if (view === 'chat') renderChat(root);
    else if (view === 'tickets') renderMyTickets(root);
    else if (view === 'analyst') renderAnalyst(root);
    else if (view === 'dashboard') renderDashboard(root);
  }

  /* ============================================================
     Chat com a IA
     ============================================================ */
  function renderChat(root) {
    root.appendChild(el('div', { class: 'card' }, [
      el('div', { style: 'display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;' }, [
        el('div', {}, [
          el('h2', { style: 'margin:0 0 4px; font-size:16px;' }, ['Pergunte à IA do BEEP']),
          el('p', { style: 'margin:0; font-size:12px; color:var(--ink-soft);' }, ['A IA consulta a base de conhecimento antes de sugerir abrir um chamado, e lembra da conversa até você encerrá-la.'])
        ]),
        el('button', { class: 'btn', style: 'font-size:12px; padding:6px 10px; flex-shrink:0;', onclick: endConversation }, ['Encerrar conversa'])
      ]),
      el('div', { id: 'chatLog', style: 'margin-top:10px;' }),
      el('form', { id: 'chatForm', style: 'display:flex; gap:8px; margin-top:10px;' }, [
        el('input', { type: 'text', id: 'chatInput', placeholder: 'Digite sua dúvida...' }),
        el('button', { class: 'btn primary', type: 'submit' }, ['Enviar'])
      ])
    ]));
    document.getElementById('chatForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var input = document.getElementById('chatInput');
      var val = input.value.trim();
      if (!val) return;
      input.value = '';
      askQuestion(val);
    });
    drawChatLog();
  }

  /** Encerra a conversa atual — a IA "esquece" tudo o que foi dito até
   * aqui. Pedido explícito: se o colaborador quiser mudar de assunto, ele
   * consegue limpar o histórico em vez de arrastar o contexto anterior
   * (e a próxima pergunta não herda mais nada da conversa encerrada). */
  function endConversation() {
    if (state.messages.length === 0) return;
    state.messages = [];
    state.ticketForm = null;
    drawChatLog();
  }

  function drawChatLog() {
    var log = document.getElementById('chatLog');
    if (!log) return;
    log.innerHTML = '';
    if (state.messages.length === 0) {
      log.appendChild(el('p', { class: 'empty' }, ['Faça sua primeira pergunta — abrir chamado é sempre a última alternativa.']));
    }
    state.messages.forEach(function (m) {
      if (m.role === 'user') {
        log.appendChild(el('div', { class: 'msg user' }, [el('div', { class: 'bubble' }, [m.content])]));
        return;
      }
      if (m.role === 'pending') {
        // Três pontinhos animados em vez de um "Pensando..." parado — dá a
        // sensação de que algo está de fato acontecendo, não que travou.
        var dots = el('span', { class: 'typing-dots' }, [el('span', {}, []), el('span', {}, []), el('span', {}, [])]);
        log.appendChild(el('div', { class: 'msg assistant' }, [el('div', { class: 'bubble' }, [dots])]));
        return;
      }
      var wrap = el('div', { class: 'msg assistant' }, [el('div', { class: 'bubble' }, [m.content])]);

      // Conversa (agradecimento, saudação, despedida): é só uma fala, não
      // uma consulta à base. Mostrar "72% de confiança" e "isso resolveu
      // sua dúvida?" embaixo de um "que bom que ajudou!" é justamente o
      // tipo de resposta robótica que se quer evitar. Ainda assim pode vir
      // com opções (ex.: "quero abrir chamado mesmo assim" quando o
      // colaborador pediu pra pular direto pro atendimento humano).
      if (m.decision === 'conversa') {
        if (m.options && m.options.length && !m.resolvedChoice) {
          var convChoices = el('div', { style: 'margin-top:8px; display:flex; flex-direction:column; gap:6px;' });
          m.options.forEach(function (opt) {
            convChoices.appendChild(el('button', {
              class: 'btn', style: 'text-align:left; font-size:12.5px; padding:8px 10px;',
              onclick: function () { m.resolvedChoice = true; drawChatLog(); askQuestion(opt.question, opt.label); }
            }, [opt.label]));
          });
          wrap.appendChild(convChoices);
        }
        log.appendChild(wrap);
        return;
      }

      // Pill de decisão ("Sugestão de chamado"), % de confiança e "Fonte:"
      // (que expõe o texto cru da Pergunta do FAQ — incluindo as
      // palavras-chave que o DP separa por ";" pra ajudar a busca, nunca
      // pensadas pra aparecer pro colaborador) só fazem sentido pra quem
      // está calibrando a base — ficam visíveis só pro analista.
      if (state.user.role === 'analyst') {
        var confPct = Math.round(m.confidence * 100);
        var decisionLabel = m.decision === 'auto_answer' ? 'Resposta automática'
          : m.decision === 'suggest_ticket' ? 'Sugestão de chamado'
          : m.decision === 'clarify' ? 'Preciso entender melhor'
          : 'Confirmação de chamado necessária';
        var decisionCls = m.decision === 'auto_answer' ? 'success'
          : (m.decision === 'suggest_ticket' || m.decision === 'clarify') ? 'warning'
          : 'critical';
        wrap.appendChild(el('div', { style: 'margin-top:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;' }, [
          el('span', { class: 'pill ' + decisionCls }, [decisionLabel]),
          el('span', { class: 'mono', style: 'font-size:11.5px; color:var(--ink-soft);' }, [confPct + '% de confiança'])
        ]));
        if (m.source && m.decision !== 'clarify') {
          wrap.appendChild(el('p', { style: 'font-size:11.5px; color:var(--ink-soft); margin:6px 0 0;' }, ['Fonte: ' + m.source.department + ' — "' + m.source.question + '"']));
        }
      }
      // Passo a passo ilustrado: o texto de cada etapa entra na hora e a
      // tela correspondente vai preenchendo em seguida, para a resposta
      // nunca ficar esperando imagem carregar.
      if (m.steps && m.steps.length) {
        wrap.appendChild(renderSteps_(m.steps));
      }

      // Desambiguação: em vez de arriscar a resposta errada, a IA mostra os
      // assuntos possíveis e deixa o colaborador escolher. Clicar refaz a
      // pergunta já com o texto do assunto certo, então a rodada seguinte
      // cai com confiança alta no FAQ correto.
      if (m.decision === 'clarify' && m.options && m.options.length && !m.resolvedChoice) {
        var choices = el('div', { style: 'margin-top:8px; display:flex; flex-direction:column; gap:6px;' });
        m.options.forEach(function (opt) {
          choices.appendChild(el('button', {
            class: 'btn', style: 'text-align:left; font-size:12.5px; padding:8px 10px;',
            onclick: function () { m.resolvedChoice = true; drawChatLog(); askQuestion(opt.question); }
          }, [opt.label]));
        });
        choices.appendChild(el('button', {
          class: 'btn ghost', style: 'text-align:left; font-size:12px; padding:6px 10px;',
          onclick: function () { m.resolvedChoice = true; m.helpful = false; drawChatLog(); }
        }, ['Nenhum dos dois — quero falar com um analista']));
        wrap.appendChild(choices);
        log.appendChild(wrap);
        return;
      }

      if (!m.ticket) {
        if (m.helpful === undefined && !m.skipHelpfulCheck) {
          wrap.appendChild(el('div', { style: 'margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;' }, [
            el('span', { style: 'font-size:12.5px; color:var(--ink-soft);' }, ['Isso resolveu sua dúvida?']),
            el('button', { class: 'btn', style: 'padding:5px 10px; font-size:12.5px;', onclick: function () { m.helpful = true; drawChatLog(); if (m.logId) call('markAiInteractionUtil', m.logId, true); } }, ['Sim']),
            el('button', { class: 'btn', style: 'padding:5px 10px; font-size:12.5px;', onclick: function () { m.helpful = false; drawChatLog(); if (m.logId) call('markAiInteractionUtil', m.logId, false); } }, ['Não, preciso de mais ajuda'])
          ]));
        } else if (m.helpful === true) {
          wrap.appendChild(el('p', { style: 'font-size:12px; color:var(--ink-soft); margin-top:6px;' }, ['Que bom! Se precisar de algo mais, é só perguntar.']));
        } else if (m.declinedTicket) {
          wrap.appendChild(el('p', { style: 'font-size:12px; color:var(--ink-soft); margin-top:6px;' }, ['Tudo bem! Se mudar de ideia, me pergunte de novo.']));
        } else if (state.ticketForm && state.ticketForm.forMessage === m) {
          wrap.appendChild(renderTicketForm(m));
        } else {
          wrap.appendChild(el('div', { style: 'margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--pulse-tint); border-radius:8px; padding:8px 10px;' }, [
            el('span', { style: 'font-size:12.5px; color:var(--warning-ink);' }, ['Quer abrir um chamado para um analista do DP?']),
            el('button', { class: 'btn primary', style: 'padding:5px 10px; font-size:12.5px;', onclick: function () { startTicketForm(m); } }, ['Sim, abrir chamado']),
            el('button', { class: 'btn', style: 'padding:5px 10px; font-size:12.5px;', onclick: function () { m.declinedTicket = true; drawChatLog(); } }, ['Agora não'])
          ]));
        }
      } else {
        wrap.appendChild(el('p', { style: 'font-size:12px; color:var(--ink-soft); margin-top:6px;' }, ['✅ Chamado ' + m.ticket + ' aberto. Um analista vai te responder em breve.']));
      }
      log.appendChild(wrap);
    });
    log.scrollTop = log.scrollHeight;
  }

  /** Cache das imagens já buscadas — reabrir a mesma conversa (ou repetir
   * o passo a passo) não deve bater no Drive de novo. */
  var stepImageCache_ = {};

  function renderSteps_(steps) {
    var box = el('div', { style: 'margin-top:10px; display:flex; flex-direction:column; gap:12px;' });
    steps.forEach(function (step) {
      var card = el('div', { style: 'border-left:3px solid var(--brand); padding-left:10px;' }, [
        el('div', { style: 'font-weight:700; font-size:13px; color:var(--brand-ink);' },
          [String(step.order) + '. ' + step.title]),
        step.text ? el('div', { style: 'font-size:13px; margin-top:3px; white-space:pre-wrap;' }, [step.text]) : null
      ]);
      if (step.imageId) {
        var slot = el('div', { style: 'margin-top:6px;' }, [
          el('span', { style: 'font-size:11.5px; color:var(--ink-soft);' }, ['carregando a tela...'])
        ]);
        card.appendChild(slot);
        loadStepImage_(step, slot);
      }
      box.appendChild(card);
    });
    return box;
  }

  async function loadStepImage_(step, slot) {
    try {
      var dataUri = stepImageCache_[step.imageId];
      if (!dataUri) {
        dataUri = await call('getStepImage', step.imageId);
        stepImageCache_[step.imageId] = dataUri;
      }
      slot.innerHTML = '';
      if (!dataUri) return; // imagem indisponível: a etapa vale pelo texto
      // Miniatura para não empurrar a conversa toda pra baixo; clicar abre
      // a tela em tamanho real, que é quando a pessoa quer ver detalhe.
      var img = el('img', {
        src: dataUri, alt: 'Passo ' + step.order + ': ' + step.title,
        style: 'max-width:100%; width:360px; border:1px solid var(--line); border-radius:8px; cursor:zoom-in; display:block;'
      });
      img.addEventListener('click', function () { openImageOverlay_(dataUri); });
      slot.appendChild(img);
    } catch (e) {
      slot.innerHTML = '';
    }
  }

  function openImageOverlay_(dataUri) {
    var overlay = el('div', {
      style: 'position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; ' +
        'justify-content:center; z-index:999; padding:20px; cursor:zoom-out;'
    }, [el('img', { src: dataUri, style: 'max-width:100%; max-height:100%; border-radius:6px;' })]);
    overlay.addEventListener('click', function () { document.body.removeChild(overlay); });
    document.body.appendChild(overlay);
  }

  async function askQuestion(query, displayText) {
    // Captura a conversa ANTES de empilhar a pergunta atual — é esse
    // histórico que vai junto pro servidor, pra IA responder com o fio da
    // conversa em vez de tratar cada pergunta isolada.
    // `displayText` existe pros botões de opção cujo `query` de verdade é
    // um sinalizador interno (ex.: confirmar "abrir chamado mesmo assim")
    // — o balão do colaborador mostra o texto do botão, não o sinalizador.
    var history = conversationHistory_();
    state.messages.push({ role: 'user', content: displayText || query });
    state.messages.push({ role: 'pending' });
    drawChatLog();
    try {
      var result = await call('askAi', query, history);
      state.messages.pop();
      var m = {
        role: 'assistant', content: result.answer, confidence: result.confidence, decision: result.decision,
        source: result.source, options: result.options || [], steps: result.steps || [],
        // Se abrir chamado a partir daqui, é este campo que vira a base do
        // assunto/resumo (ver deriveTicketSubject_/draftTicketContext) —
        // por isso usa o texto legível do botão, não o sinalizador interno.
        query: displayText || query,
        logId: result.logId || null, skipHelpfulCheck: !!result.skipHelpfulCheck
      };
      state.messages.push(m);
      // O colaborador já deixou claro que quer abrir chamado (clicou
      // "mesmo assim") — abre o formulário na hora, sem pedir confirmação
      // de novo em cima da que ele já deu.
      if (result.autoOpenTicket) startTicketForm(m);
    } catch (e) {
      state.messages.pop();
      state.messages.push({ role: 'assistant', content: 'Ocorreu um erro ao consultar a IA: ' + errorMessage(e), confidence: 0, decision: 'auto_ticket', source: null, query: query });
    }
    drawChatLog();
  }

  /* ---------------- Abertura de chamado a partir do chat ---------------- */

  function startTicketForm(m) {
    // Nome/matrícula vêm de quem está logado (state.user, já validado
    // contra a aba Colaboradores) — não é mais um campo editável, pra não
    // repetir o problema de abrir chamado com um nome de teste antigo
    // (salvo de uma sessão anterior) em vez de quem realmente está usando.
    state.ticketForm = {
      forMessage: m, name: state.user.name, matricula: state.user.matricula,
      department: m.source ? m.source.department : (state.departments[0] ? state.departments[0].name : ''),
      subject: '', description: '', file: null, loading: false
    };
    drawChatLog();
  }

  /** Uma etapa só: Assunto e Descrição juntos (antes eram duas telas
   * separadas, com a descrição pré-preenchida pelo resumo da conversa com
   * a IA). O colaborador escreve os dois do zero — assunto vira o título
   * do chamado (era, por engano, preenchido sozinho com a pergunta feita
   * à IA), e a descrição fica em branco com uma orientação de detalhar
   * bem, em vez de vir com o contexto do chat já pronto. */
  function renderTicketForm(m) {
    var tf = state.ticketForm;
    var box = el('div', { style: 'margin-top:10px; border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--paper);' });

    var fileInput = el('input', { type: 'file' });
    var subjectInput = el('input', {
      type: 'text', value: tf.subject, placeholder: 'Do que se trata o seu chamado?',
      oninput: function (ev) { tf.subject = ev.target.value; subjectError.textContent = ''; }
    });
    var subjectError = el('span', { style: 'font-size:11px; color:var(--critical-ink);' }, []);
    var descArea = el('textarea', {
      rows: 6,
      placeholder: 'Detalhe ao máximo o que você precisa que o analista entenda. Se for útil, anexe um arquivo abaixo.',
      oninput: function (ev) { tf.description = ev.target.value; descError.textContent = ''; }
    });
    descArea.value = tf.description;
    var descError = el('span', { style: 'font-size:11px; color:var(--critical-ink);' }, []);

    box.appendChild(el('p', { style: 'margin:0 0 8px; font-weight:700; font-size:13px;' }, ['Abrir chamado para o DP']));
    box.appendChild(el('p', { style: 'margin:0 0 10px; font-size:12px; color:var(--ink-soft);' },
      ['Aberto por ', el('b', { style: 'color:var(--ink);' }, [tf.name]), ' · matrícula ' + tf.matricula]));
    box.appendChild(el('label', { class: 'field' }, [el('span', {}, ['Categoria']),
      el('select', { onchange: function (ev) { tf.department = ev.target.value; } },
        state.departments.map(function (d) {
          var opt = el('option', { value: d.name }, [d.name]);
          if (d.name === tf.department) opt.setAttribute('selected', 'selected');
          return opt;
        }))]));
    box.appendChild(el('label', { class: 'field' }, [el('span', {}, ['Assunto *']), subjectInput, subjectError]));
    box.appendChild(el('label', { class: 'field' }, [el('span', {}, ['Descrição para o analista *']), descArea, descError]));
    box.appendChild(el('label', { class: 'field' }, [el('span', {}, ['Anexar arquivo (opcional)']), fileInput]));
    box.appendChild(el('div', { style: 'display:flex; justify-content:flex-end; gap:8px;' }, [
      el('button', { class: 'btn', disabled: tf.loading ? 'disabled' : null, onclick: function () { state.ticketForm = null; drawChatLog(); } }, ['Cancelar']),
      el('button', {
        class: 'btn primary', disabled: tf.loading ? 'disabled' : null, onclick: async function () {
          var ok = true;
          if (!tf.subject.trim()) { subjectError.textContent = 'Preencha o assunto.'; ok = false; }
          if (!tf.description.trim()) { descError.textContent = 'Detalhe sua solicitação.'; ok = false; }
          if (!ok) return;
          tf.file = fileInput.files[0] || null;
          await confirmTicketOpening(m);
        }
      }, [tf.loading ? 'Abrindo...' : 'Abrir chamado'])
    ]));
    return box;
  }

  async function confirmTicketOpening(m) {
    var tf = state.ticketForm;
    tf.loading = true; drawChatLog();
    try {
      var payload = {
        name: tf.name, matricula: tf.matricula, department: tf.department,
        subject: tf.subject, description: tf.description,
        source: (m.decision === 'auto_ticket' ? 'ia_automatico' : 'ia_sugerido')
      };
      var detail = await call('openTicket', payload);
      if (tf.file) {
        var base64 = await readFileAsBase64_(tf.file);
        await call('uploadAttachment', detail.ticket.id, tf.file.name, tf.file.type || 'application/octet-stream', base64);
      }
      m.ticket = detail.ticket.protocol;
      state.ticketForm = null;
    } catch (e) {
      alert('Não foi possível abrir o chamado: ' + errorMessage(e));
      tf.loading = false;
    }
    drawChatLog();
  }

  /* ============================================================

  /* ============================================================
     Fila do analista
     ============================================================ */
  function renderAnalyst(root) {
    var av = state.analystView;
    var heading = el('h2', { style: 'margin:0 0 12px; font-size:16px;' }, ['Fila do analista']);

    var tabButtons = {};
    var tabsRow = el('div', { class: 'toolbar' });
    ['inbox', 'mine', 'all', 'closed'].forEach(function (mode) {
      var label = mode === 'inbox' ? 'Caixa de entrada' : mode === 'mine' ? 'Meus atendimentos' : mode === 'closed' ? 'Encerrados' : 'Todos os chamados';
      var btn = el('button', { class: 'chip', onclick: function () { av.mode = mode; updateTabsUI(); refreshList(); } }, [label]);
      tabButtons[mode] = btn;
      tabsRow.appendChild(btn);
    });
    function updateTabsUI() { Object.keys(tabButtons).forEach(function (mode) { tabButtons[mode].classList.toggle('active', av.mode === mode); }); }
    updateTabsUI();

    var overdueChip = el('button', { class: 'chip' + (av.overdue ? ' active' : ''), onclick: function () { av.overdue = !av.overdue; overdueChip.classList.toggle('active', av.overdue); refreshList(); } }, ['🔴 Atrasados']);
    var pendingChip = el('button', { class: 'chip' + (av.pending ? ' active' : ''), onclick: function () { av.pending = !av.pending; pendingChip.classList.toggle('active', av.pending); refreshList(); } }, ['Pendente interação do analista']);
    var searchInput = el('input', {
      type: 'text', style: 'max-width:260px;', placeholder: 'Buscar por protocolo, matrícula, colaborador ou assunto...', value: av.q,
      oninput: function (ev) { av.q = ev.target.value; scheduleAnalystSearch_(refreshList); }
    });
    var statusSelect = el('select', { style: 'max-width:200px;', onchange: function (ev) { av.status = ev.target.value; refreshList(); } },
      [el('option', { value: '' }, ['Todos os status'])].concat(Object.keys(STATUS_LABEL).map(function (s) {
        var opt = el('option', { value: s }, [STATUS_LABEL[s]]);
        if (s === av.status) opt.setAttribute('selected', 'selected');
        return opt;
      })));
    var filterRow = el('div', { class: 'toolbar' }, [overdueChip, pendingChip, searchInput, statusSelect]);

    var list = el('div', { class: 'stack' });

    root.appendChild(heading);
    root.appendChild(tabsRow);
    root.appendChild(filterRow);
    root.appendChild(list);

    async function refreshList() {
      list.innerHTML = '';
      list.appendChild(skeletonTicketRows_(4));
      try {
        var filters = {
          unassigned: av.mode === 'inbox', mine: av.mode === 'mine',
          status: av.mode === 'closed' ? 'encerrado' : av.status,
          overdue: av.overdue, pendingAnalyst: av.pending, q: av.q
        };
        var tickets = await call('listTickets', filters);
        list.innerHTML = '';
        if (tickets.length === 0) {
          list.appendChild(el('p', { class: 'empty' }, [av.mode === 'inbox' ? 'Caixa de entrada vazia — tudo distribuído!' : 'Nenhum chamado encontrado.']));
          return;
        }
        tickets.forEach(function (t) { list.appendChild(ticketRow_(t, function () { openTicketDetail_(t.id, 'analyst'); })); });
      } catch (e) {
        console.error('Falha ao carregar a fila do analista:', e);
        list.innerHTML = '';
        list.appendChild(el('p', { class: 'empty' }, ['Erro ao carregar os chamados: ' + errorMessage(e)]));
      }
    }
    refreshList();
  }

  var analystSearchTimer_ = null;
  function scheduleAnalystSearch_(fn) {
    clearTimeout(analystSearchTimer_);
    analystSearchTimer_ = setTimeout(fn, 350);

  /* ============================================================
     Detalhe / atendimento do chamado
     ============================================================ */

    root.innerHTML = '';
    root.appendChild(skeletonTicketDetail_());
    try {
      var detail = await call('getTicketDetail', id);
      await renderTicketDetail(root, detail, fromView);
    } catch (e) {
      root.innerHTML = '';

  function drawThread_(container, history) {
    container.innerHTML = '';
    history.forEach(function (h) {
      var mine = h.role === 'analista';
      var bubbleStyle = h.internal
        ? 'background:var(--warning-tint); color:var(--warning-ink); border:1px dashed color-mix(in srgb, var(--warning) 55%, transparent);'
        : (mine ? 'background:var(--brand-strong); color:#fff;' : 'background:var(--line-soft); color:var(--ink);');
      container.appendChild(el('div', { style: 'max-width:85%;' + (mine ? ' margin-left:auto;' : '') }, [
        el('div', { style: 'font-size:11px; color:var(--ink-soft); margin-bottom:3px;' + (mine ? ' text-align:right;' : '') },
          [h.author + (h.internal ? ' 🔒 nota interna' : '') + ' · ' + formatDate_(h.at)]),
        el('div', { style: 'padding:9px 12px; border-radius:12px; font-size:13px; white-space:pre-wrap; ' + bubbleStyle }, [h.body])
      ]));
    });
  }

  /** Modal simples (overlay + card) — usado pelo Transferir e pelo
   * Finalizar, que antes eram cartões fixos empilhados na barra lateral
   * (um dos motivos dela ficar comprida demais). */
  function openModal_(titleText, bodyNode) {
    var overlay = el('div', {
      style: 'position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; ' +
        'align-items:center; justify-content:center; z-index:1000; padding:16px;',
      onclick: function (ev) { if (ev.target === overlay) close(); }
    });
    var box = el('div', { class: 'card', style: 'max-width:420px; width:100%; max-height:85vh; overflow:auto;' }, [
      el('div', { style: 'display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;' }, [
        el('h3', { style: 'margin:0; font-size:14px;' }, [titleText]),
        el('button', { class: 'btn ghost', style: 'padding:2px 8px;', onclick: function () { close(); } }, ['✕'])
      ]),
      bodyNode
    ]);
    overlay.appendChild(box);
    function close() { document.body.removeChild(overlay); }
    document.body.appendChild(overlay);
    return close;
  }

  function buildComposer_(t, isAnalyst, onDone) {
    var mode = 'publica';
    var box = el('div', { class: 'composer' });
    var textarea = el('textarea', { rows: 4, placeholder: 'Escreva sua mensagem...' });
    var modeRow = null, statusSelect = null;

    if (isAnalyst) {
      var btnPublic = el('button', { class: 'active', onclick: function () { mode = 'publica'; applyMode(); } }, ['Responder ao colaborador']);
      var btnInternal = el('button', { onclick: function () { mode = 'interna'; applyMode(); } }, ['🔒 Nota interna']);
      modeRow = el('div', { class: 'mode-row' }, [btnPublic, btnInternal]);
      box.appendChild(modeRow);
    }

    box.appendChild(textarea);

    // Rodapé compacto: à esquerda o status (só resposta pública), à
    // direita anexar + respostas padrão + enviar — tudo em botões
    // pequenos, em vez da faixa de seleção fixa e do card de anexos à
    // parte que ocupavam a barra lateral inteira.
    var footer = el('div', { style: 'display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;' });
    var statusWrap = null;
    if (isAnalyst) {
      statusSelect = el('select', { style: 'max-width:190px;' }, Object.keys(STATUS_LABEL).filter(function (s) { return s !== 'encerrado'; }).map(function (s) {
        var opt = el('option', { value: s }, [STATUS_LABEL[s]]);
        if (s === 'aguardando_usuario') opt.setAttribute('selected', 'selected');
        return opt;
      }));
      statusWrap = el('label', { style: 'display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft);' }, ['Ao enviar, marcar como', statusSelect]);
      footer.appendChild(statusWrap);
    } else {
      footer.appendChild(el('span', {}, ['']));
    }

    var actionsRight = el('div', { style: 'display:flex; align-items:center; gap:6px;' });
    if (isAnalyst) {
      var fileInput = el('input', { type: 'file', style: 'display:none;' });
      var attachBtn = el('button', {
        class: 'btn ghost', title: 'Anexar arquivo', style: 'padding:6px 9px; font-size:14px;',
        onclick: function () { fileInput.click(); }
      }, ['📎']);
      fileInput.addEventListener('change', async function () {
        var file = fileInput.files[0];
        if (!file) return;
        attachBtn.setAttribute('disabled', 'disabled');
        try {
          var base64 = await readFileAsBase64_(file);
          onDone(await call('uploadAttachment', t.id, file.name, file.type || 'application/octet-stream', base64));
        } catch (e) { alert('Falha ao anexar: ' + errorMessage(e)); attachBtn.removeAttribute('disabled'); }
      });

      var cannedSelect = el('select', {
        title: 'Respostas padrão', style: 'max-width:40px; padding:6px 2px; text-align:center;',
        onchange: function (ev) {
          var id = ev.target.value;
          ev.target.value = '';
          var chosen = (cannedSelect._data || []).filter(function (c) { return c.id === id; })[0];
          if (chosen) textarea.value = textarea.value.trim() ? textarea.value + '\n\n' + chosen.content : chosen.content;
        }
      });
      loadCannedResponses_(t.department, cannedSelect);
      var cannedManageBtn = el('button', {
        class: 'btn ghost', title: 'Gerenciar respostas padrão', style: 'padding:6px 8px; font-size:12px;',
        onclick: function () { openCannedManagerModal_(t.department, cannedSelect); }
      }, ['⚙']);

      actionsRight.appendChild(fileInput);
      actionsRight.appendChild(attachBtn);
      actionsRight.appendChild(cannedSelect);
      actionsRight.appendChild(cannedManageBtn);
    }
    var sendBtn = el('button', { class: 'btn primary', onclick: function () { send(); } }, ['Enviar']);
    actionsRight.appendChild(sendBtn);
    footer.appendChild(actionsRight);
    box.appendChild(footer);

    function applyMode() {
      var internal = mode === 'interna';
      box.className = 'composer' + (internal ? ' internal' : '');
      modeRow.children[0].className = internal ? '' : 'active';
      modeRow.children[1].className = internal ? 'active' : '';
      textarea.placeholder = internal ? 'Nota interna — só o time de atendimento vê.' : 'Escreva a resposta que o colaborador vai receber...';
      sendBtn.textContent = internal ? 'Salvar nota interna' : 'Enviar resposta';
      if (statusWrap) statusWrap.style.display = internal ? 'none' : 'flex';
    }
    if (isAnalyst) applyMode();

    async function send() {
      var body = textarea.value.trim();
      if (!body) return;
      sendBtn.disabled = true;
      try {
        var isInternal = isAnalyst && mode === 'interna';
        var newStatus = (isAnalyst && !isInternal) ? statusSelect.value : null;
        onDone(await call('addComment', t.id, body, isInternal, newStatus));
      } catch (e) {
        alert('Não foi possível enviar: ' + errorMessage(e));
        sendBtn.disabled = false;
      }
    }
    return box;
  }

  async function loadCannedResponses_(department, selectEl) {
    var responses = await call('listCannedResponses', department);
    selectEl._data = responses;
    selectEl.innerHTML = '';
    selectEl.appendChild(el('option', { value: '', disabled: 'disabled', selected: 'selected' }, ['🗂']));
    responses.forEach(function (r) { selectEl.appendChild(el('option', { value: r.id }, [r.title])); });
  }

  /** Criar/remover respostas padrão virou um modal (botão de engrenagem ao
   * lado do seletor no rodapé do composer), em vez de uma caixa que ficava
   * sempre montada dentro do composer — mais um motivo da tela antiga
   * ficar comprida. */
  async function openCannedManagerModal_(department, selectEl) {
    var responses = await call('listCannedResponses', department);
    var titleInput = el('input', { type: 'text', placeholder: 'Título', style: 'margin-top:10px;' });
    var contentArea = el('textarea', { rows: 2, placeholder: 'Texto da resposta padrão...' });
    var genericCheck = el('input', { type: 'checkbox' });
    var body = el('div', {}, [
      responses.length
        ? el('div', {}, responses.map(function (r) {
          return el('div', { style: 'display:flex; justify-content:space-between; gap:8px; font-size:12px; margin-bottom:4px;' }, [
            el('span', {}, [r.title + (r.department ? '' : ' (todas as filas)')]),
            el('button', {
              class: 'btn ghost', style: 'color:var(--critical-ink); font-size:11.5px; padding:2px 6px;',
              onclick: async function () {
                await call('deleteCannedResponse', r.id, department);
                close();
                loadCannedResponses_(department, selectEl);
                openCannedManagerModal_(department, selectEl);
              }
            }, ['Remover'])
          ]);
        }))
        : el('p', { style: 'margin:0; font-size:11.5px; color:var(--ink-soft);' }, ['Nenhuma resposta padrão ainda.']),
      el('hr', { style: 'border:none; border-top:1px solid var(--line-soft); margin:10px 0;' }),
      el('label', { class: 'field' }, [el('span', {}, ['Nova resposta padrão']), titleInput]),
      contentArea,
      el('div', { style: 'display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:6px;' }, [
        el('label', { style: 'display:flex; gap:6px; align-items:center; font-size:11px; color:var(--ink-soft);' }, [genericCheck, 'Disponível em todas as filas']),
        el('button', {
          class: 'btn', style: 'font-size:12px;',
          onclick: async function () {
            var title = titleInput.value.trim(), content = contentArea.value.trim();
            if (!title || !content) return;
            await call('createCannedResponse', title, content, genericCheck.checked ? null : department);
            close();
            loadCannedResponses_(department, selectEl);
            openCannedManagerModal_(department, selectEl);
          }
        }, ['Salvar'])
      ])
    ]);
    var close = openModal_('Respostas padrão', body);
  }

  /** Status + prioridade agora é uma linha compacta dentro do card do
   * Solicitante, em vez de um card "Atendimento" à parte — "Assumir para
   * mim" também não mora mais aqui: virou a chamada de ação que substitui
   * o composer enquanto o chamado não está vinculado a ninguém (ver
   * renderTicketDetail), porque é só assim que dá pra responder. */
  function buildStatusPriorityMini_(t, onDone) {
    var statusSel = el('select', {
      style: 'font-size:11.5px;',
      onchange: async function (ev) { try { onDone(await call('changeStatus', t.id, ev.target.value)); } catch (e) { alert(errorMessage(e)); } }
    }, Object.keys(STATUS_LABEL).filter(function (s) { return s !== 'encerrado'; }).map(function (s) {
      var opt = el('option', { value: s }, [STATUS_LABEL[s]]);
      if (s === t.status) opt.setAttribute('selected', 'selected');
      return opt;
    }));
    var prioritySel = el('select', {
      style: 'font-size:11.5px;',
      onchange: async function (ev) { try { onDone(await call('changePriority', t.id, ev.target.value)); } catch (e) { alert(errorMessage(e)); } }
    }, Object.keys(PRIORITY_LABEL).map(function (p) {
      var opt = el('option', { value: p }, [PRIORITY_LABEL[p]]);
      if (p === t.priority) opt.setAttribute('selected', 'selected');
      return opt;
    }));
    return el('div', { style: 'display:flex; gap:6px; margin-top:8px;' }, [statusSel, prioritySel]);
  }

  /** Conteúdo do modal "Transferir" — uma vez o chamado tendo responsável,
   * não oferece mais a opção de devolver pra caixa de entrada (o servidor
   * também recusa), só transferir para outro analista. */
  function buildTransferModalBody_(t, onDone, closeModal) {
    var box = el('div', {});
    box.appendChild(el('p', { style: 'margin:0 0 10px; font-size:11.5px; color:var(--ink-soft);' },
      ['Responsável atual: ', el('b', { style: 'color:var(--ink);' }, [t.assignedToName || t.assignedTo || 'ninguém — na caixa de entrada geral'])]));
    var analystSelect = el('select', {});
    var deptSelect = el('select', {}, state.departments.map(function (d) {
      var opt = el('option', { value: d.name }, [d.name]);
      if (d.name === t.department) opt.setAttribute('selected', 'selected');
      return opt;
    }));
    var reasonInput = el('input', { type: 'text', placeholder: 'Motivo (opcional)' });
    var transferBtn = el('button', { class: 'btn primary', style: 'width:100%; margin-top:4px;', disabled: 'disabled' }, ['Transferir']);

    function checkChanged() { transferBtn.disabled = !(analystSelect.value !== (t.assignedTo || '') || deptSelect.value !== t.department); }
    analystSelect.addEventListener('change', checkChanged);
    deptSelect.addEventListener('change', checkChanged);
    transferBtn.addEventListener('click', async function () {
      try {
        var d = await call('transferTicket', t.id, analystSelect.value || null, deptSelect.value, reasonInput.value.trim() || null);
        closeModal(); onDone(d);
      } catch (e) { alert(errorMessage(e)); }
    });

    box.appendChild(el('label', { class: 'field' }, [el('span', {}, ['Novo analista responsável']), analystSelect]));
    box.appendChild(el('label', { class: 'field' }, [el('span', {}, ['Fila']), deptSelect]));
    box.appendChild(el('label', { class: 'field' }, [el('span', {}, ['Motivo']), reasonInput]));
    box.appendChild(transferBtn);
    loadAnalystsInto_(analystSelect, t.assignedTo, /* allowUnassigned */ !t.assignedTo);
    return box;
  }

  async function loadAnalystsInto_(selectEl, currentAssignee, allowUnassigned) {
    var analysts = await call('getAnalysts');
    selectEl.innerHTML = '';
    if (allowUnassigned) selectEl.appendChild(el('option', { value: '' }, ['Caixa de entrada geral (sem analista)']));
    analysts.forEach(function (a) {
      var opt = el('option', { value: a.email }, [a.name + ' (' + a.email + ')']);
      if (a.email === currentAssignee) opt.setAttribute('selected', 'selected');
      selectEl.appendChild(opt);
    });
  }

  /** Só a lista de anexos já enviados — anexar um novo agora é pelo 📎 no
   * rodapé do composer, então não precisa mais de um card com upload
   * próprio aqui (outro pedaço que engordava a barra lateral). */
  function buildAttachmentsList_(attachments) {
    if (attachments.length === 0) return null;
    return el('div', { class: 'card' }, [
      el('h3', { style: 'margin:0 0 6px; font-size:13px;' }, ['Anexos']),
      el('div', { style: 'display:flex; flex-direction:column; gap:2px;' }, attachments.map(function (a) {
        return el('a', { href: a.url, target: '_blank', style: 'font-size:12px; color:var(--brand-ink);' }, ['📎 ' + a.name]);
      }))
    ]);
  }

  /** Conteúdo do modal "Finalizar" — igual pedido: abre com uma mensagem
   * padrão de encerramento já preenchida (a do motivo mais comum),
   * editável antes de confirmar. */
  async function buildCloseModalBody_(t, onDone, closeModal) {
    var reasons = await call('getClosureReasons', t.id);
    var box = el('div', {});
    if (reasons.length === 0) {
      box.appendChild(el('p', { style: 'margin:0; font-size:11.5px; color:var(--ink-soft);' }, ['Nenhum motivo de encerramento disponível para você neste chamado.']));
      return box;
    }
    var current = reasons[0];
    var messageArea = el('textarea', { rows: 4 });
    messageArea.value = current.defaultMessage;
    var edited = false;
    messageArea.addEventListener('input', function () { edited = true; });
    var reasonSelect = el('select', {
      onchange: function (ev) {
        current = reasons.filter(function (r) { return r.value === ev.target.value; })[0];
        if (!edited) messageArea.value = current.defaultMessage;
      }
    }, reasons.map(function (r) { return el('option', { value: r.value }, [r.label]); }));
    box.appendChild(el('label', { class: 'field' }, [el('span', {}, ['Motivo *']), reasonSelect]));
    box.appendChild(el('label', { class: 'field' }, [el('span', {}, ['Mensagem para o colaborador']), messageArea]));
    var closeBtn = el('button', {
      class: 'btn primary', style: 'width:100%;',
      onclick: async function () {
        closeBtn.disabled = true;
        try {
          var d = await call('closeTicket', t.id, current.value, messageArea.value.trim());
          closeModal(); onDone(d);
        } catch (e) { alert('Não foi possível encerrar: ' + errorMessage(e)); closeBtn.disabled = false; }
      }
    }, ['Finalizar']);
    box.appendChild(closeBtn);
    return box;
  }

  async function renderTicketDetail(root, detail, fromView) {
    root.innerHTML = '';
    var t = detail.ticket;
    var isAnalyst = state.user.role === 'analyst';
    // Toda ação (responder, mudar status, transferir, etc.) já devolve o
    // chamado inteiro e atualizado (ver addComment/transferTicket/etc. em
    // Code.gs) — passando esse resultado pra cá, evita buscar tudo de novo
    // do zero numa segunda chamada só pra re-renderizar a mesma tela (era
    // uma das causas da lentidão: cada ação virava DUAS leituras completas
    // da planilha em vez de uma). Sem argumento, cai no caminho antigo
    // (busca do zero) — usado só onde ainda não há um resultado pronto.
    var refresh = function (freshDetail) {
      if (freshDetail) { renderTicketDetail(root, freshDetail, fromView); }
      else { openTicketDetail_(t.id, fromView); }
    };
    root.appendChild(el('button', { class: 'btn ghost', style: 'margin-bottom:12px;', onclick: function () { setView(fromView); } }, ['← Voltar']));

    var actionButtons = [];
    if (isAnalyst) {
      actionButtons.push(el('button', {
        class: 'btn', onclick: function () {
          var close;
          var body = buildTransferModalBody_(t, refresh, function () { close(); });
          close = openModal_('Transferir chamado', body);
        }
      }, ['Transferir']));
      if (t.status !== 'encerrado') {
        actionButtons.push(el('button', {
          class: 'btn primary', onclick: async function () {
            var close;
            var body = await buildCloseModalBody_(t, refresh, function () { close(); });
            close = openModal_('Finalizar chamado', body);
          }
        }, ['Finalizar']));
      }
    }

    root.appendChild(el('div', { class: 'card' }, [
      el('div', { style: 'display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;' }, [
        el('div', {}, [
          el('p', { class: 'mono', style: 'margin:0; font-size:11.5px; color:var(--ink-soft);' }, [t.protocol]),
          el('h2', { style: 'margin:2px 0;' }, [t.subject]),
          el('p', { style: 'margin:0; font-size:11.5px; color:var(--ink-soft);' }, [t.department + ' · aberto em ' + formatDate_(t.openedAt)])
        ]),
        el('div', { style: 'display:flex; flex-direction:column; align-items:flex-end; gap:8px;' }, [
          el('div', { style: 'display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;' }, [
            el('span', { class: 'pill ' + PRIORITY_CLASS[t.priority] }, [PRIORITY_LABEL[t.priority]]),
            el('span', { class: 'pill ' + STATUS_CLASS[t.status] }, [STATUS_LABEL[t.status]]),
            el('span', { class: 'pill ' + slaState_(t) }, [slaLabel_(t)])
          ]),
          actionButtons.length ? el('div', { style: 'display:flex; gap:6px;' }, actionButtons) : null
        ])
      ])
    ]));

    var mainCol = el('div', { class: 'stack' });
    var sideCol = el('div', { class: 'stack' });
    root.appendChild(el('div', { class: 'grid-2' }, [mainCol, sideCol]));

    var thread = el('div', { class: 'stack' });
    mainCol.appendChild(el('div', { class: 'card' }, [thread]));
    drawThread_(thread, detail.history);

    // Sem vínculo, o analista só visualiza — pra responder, primeiro
    // assume o chamado (some da caixa de entrada geral pra sempre, só dá
    // pra transferir depois, nunca devolver pra lá).
    if (isAnalyst && !t.assignedTo && t.status !== 'encerrado') {
      mainCol.appendChild(el('div', { class: 'card', style: 'text-align:center;' }, [
        el('p', { style: 'margin:0 0 10px; font-size:13px; color:var(--ink-soft);' },
          ['Este chamado ainda está na caixa de entrada geral — assuma para poder responder.']),
        el('button', {
          class: 'btn primary', onclick: async function () { try { refresh(await call('assumeTicket', t.id)); } catch (e) { alert(errorMessage(e)); } }
        }, ['Assumir para mim'])
      ]));
    } else {
      mainCol.appendChild(buildComposer_(t, isAnalyst, refresh));
    }

    var c = detail.colaborador;
    var ticketDone = t.status === 'resolvido' || t.status === 'encerrado';
    sideCol.appendChild(el('div', { class: 'card' }, [
      el('h3', { style: 'margin:0 0 10px; font-size:13px;' }, ['Solicitante']),
      el('div', { style: 'display:flex; align-items:center; gap:10px;' }, [
        el('div', {
          style: 'width:38px; height:38px; border-radius:50%; background:var(--brand-tint); color:var(--brand-ink); ' +
            'display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;'
        }, [initials_(t.requesterName)]),
        el('div', {}, [
          el('p', { style: 'margin:0; font-weight:700;' }, [t.requesterName]),
          el('p', { style: 'margin:0; font-size:11.5px; color:var(--ink-soft);' }, [t.requesterEmail]),
          t.matricula ? el('p', { style: 'margin:0; font-size:11px; color:var(--ink-soft);' }, ['Matrícula ' + t.matricula]) : null
        ])
      ]),
      // Dados vindos da aba Colaboradores (ADP) — só o analista vê, é pra
      // ajudar no atendimento (por exemplo, saber se é alguém recém
      // admitido antes de responder um chamado de primeiro acesso). Num
      // painel com fundo levemente diferente, pra separar visualmente do
      // que o próprio colaborador digitou na abertura.
      (isAnalyst && c) ? el('div', { style: 'margin-top:10px; background:var(--paper); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; gap:4px;' }, [
        c.filial ? el('p', { style: 'margin:0; font-size:12px; color:var(--ink);' }, ['🏢 Filial: ', el('b', {}, [c.filial])]) : null,
        c.celular ? el('p', { style: 'margin:0; font-size:12px; color:var(--ink);' }, ['📱 Celular: ', el('b', {}, [c.celular])]) : null,
        c.dataAdmissao ? el('p', { style: 'margin:0; font-size:12px; color:var(--ink);' }, ['📅 Admissão: ', el('b', {}, [new Date(c.dataAdmissao).toLocaleDateString('pt-BR')])]) : null
      ]) : null,
      el('hr', { style: 'border:none; border-top:1px solid var(--line-soft); margin:10px 0 8px;' }),
      el('div', {}, [
        el('p', { style: 'margin:0 0 2px; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;' }, ['Prazo']),
        formatDeadline_(t.slaDueAt, { done: ticketDone })
      ]),
      isAnalyst ? buildStatusPriorityMini_(t, refresh) : null
    ]));

    var attachmentsCard = buildAttachmentsList_(detail.attachments);
    if (attachmentsCard) sideCol.appendChild(attachmentsCard);

    if (t.status === 'encerrado') {
      sideCol.appendChild(el('div', { class: 'card' }, [
        el('h3', { style: 'margin:0 0 6px; font-size:13px;' }, ['Encerrado']),
        el('p', { style: 'margin:0; font-size:11.5px; color:var(--ink-soft);' }, [(t.closureReason || '') + ' · ' + (t.closedAt ? formatDate_(t.closedAt) : '')])
      ]));
    }
  }

  /* ============================================================
     Dashboard
     ============================================================ */
  var CHART_COLORS_ = { teal: '#00afaa', tealDark: '#007b75', orange: '#fba600', red: '#d6483e', ink: '#3c4a53', track: '#efefef' };

  async function renderDashboard(root) {
    root.appendChild(el('h2', { style: 'margin:0 0 12px; font-size:16px;' }, ['Dashboard']));
    var skeleton = skeletonDashboard_();
    root.appendChild(skeleton);
    var stats = await call('getDashboardStats');
    skeleton.remove();
    root.appendChild(el('div', { class: 'stat-grid' }, [
      statCard_('Total de chamados', stats.total, CHART_COLORS_.tealDark),
      statCard_('Em aberto', stats.abertos, CHART_COLORS_.orange),
      statCard_('Finalizados', stats.finalizados, CHART_COLORS_.teal)
    ]));

    var statusPares = Object.keys(stats.abertosPorStatus)
      .map(function (s) { return [STATUS_LABEL[s] || s, stats.abertosPorStatus[s]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    var atrasadosBanner = stats.atrasados > 0
      ? el('div', {
        style: 'display:flex; align-items:center; gap:10px; background:var(--critical-tint); color:var(--critical-ink); ' +
          'border-radius:8px; padding:10px 14px; margin:4px 0 12px; font-size:14px; font-weight:800;'
      }, ['🔴 ' + stats.atrasados + ' chamado' + (stats.atrasados === 1 ? '' : 's') + ' em aberto ' + (stats.atrasados === 1 ? 'está' : 'estão') + ' atrasado' + (stats.atrasados === 1 ? '' : 's') + '!'])
      : null;
    root.appendChild(barListCard_(
      'Dos chamados em aberto, por status',
      stats.atrasados > 0
        ? 'Já contado dentro dos números abaixo — não é um status à parte.'
        : 'Nenhum atrasado no momento.',
      statusPares,
      { colorFor: function () { return CHART_COLORS_.orange; }, banner: atrasadosBanner }
    ));

    root.appendChild(donutCard_(
      'IA x Analista',
      'De quem teve a dúvida resolvida (direto pela IA ou abrindo chamado), quanto % a IA resolveu sozinha.',
      [
        { label: 'Resolvido pela IA', value: stats.iaResolvidos, color: CHART_COLORS_.teal },
        { label: 'Resolvido por analista', value: stats.analistaResolvidos, color: CHART_COLORS_.orange }
      ]
    ));

    var abertosPares = Object.keys(stats.abertosPorCategoria)
      .map(function (dep) { return [dep, stats.abertosPorCategoria[dep]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    root.appendChild(barListCard_('Chamados em aberto por categoria', null, abertosPares, {}));

    var tempoPares = Object.keys(stats.tempoMedioPorCategoria)
      .map(function (dep) { return [dep, stats.tempoMedioPorCategoria[dep]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    root.appendChild(barListCard_(
      'Tempo médio até a 1ª resposta, por categoria',
      'Da abertura até a 1ª resposta do analista (tempo corrido, não é horário comercial). Mais lenta no topo.',
      tempoPares,
      {
        formatValue: formatHoras_,
        colorFor: function (horas) { return horas >= 4 ? CHART_COLORS_.red : horas >= 1 ? CHART_COLORS_.orange : CHART_COLORS_.teal; }
      }
    ));

    var totalPares = Object.keys(stats.porDepartamento)
      .map(function (dep) { return [dep, stats.porDepartamento[dep]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    root.appendChild(barListCard_('Chamados por categoria (total)', null, totalPares, { colorFor: function () { return CHART_COLORS_.tealDark; } }));
  }

  /** Gráfico de rosca simples via SVG (sem biblioteca — mantém o app sem
   * dependência externa nenhuma). Como var(--...) não funciona em atributo
   * de SVG (só em propriedade de estilo), as cores aqui vêm em hex direto,
   * espelhando as mesmas usadas no resto da tela (ver CHART_COLORS_). */
  function donutCard_(title, subtitle, segmentos) {
    var total = segmentos.reduce(function (s, x) { return s + x.value; }, 0);
    var r = 42, cx = 50, cy = 50, sw = 16, circunferencia = 2 * Math.PI * r;
    var svgHtml;
    if (total === 0) {
      svgHtml = '<svg viewBox="0 0 100 100" width="120" height="120">' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + CHART_COLORS_.track + '" stroke-width="' + sw + '" />' +
        '</svg>';
    } else {
      var offset = 0;
      var arcos = segmentos.map(function (seg) {
        var dash = (seg.value / total) * circunferencia;
        var arco = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + seg.color + '" stroke-width="' + sw + '" ' +
          'stroke-dasharray="' + dash + ' ' + (circunferencia - dash) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')" />';
        offset += dash;
        return arco;
      }).join('');
      var pct = Math.round((segmentos[0].value / total) * 100);
      svgHtml = '<svg viewBox="0 0 100 100" width="120" height="120">' + arcos +
        '<text x="50" y="57" text-anchor="middle" font-size="22" font-weight="800" fill="' + CHART_COLORS_.ink + '">' + pct + '%</text></svg>';
    }
    var svgWrap = el('div', { style: 'flex-shrink:0;' });
    svgWrap.innerHTML = svgHtml;

    var legend = el('div', { style: 'display:flex; flex-direction:column; gap:8px; justify-content:center;' },
      segmentos.map(function (seg) {
        return el('div', { style: 'display:flex; align-items:center; gap:8px; font-size:12.5px;' }, [
          el('span', { style: 'width:10px; height:10px; border-radius:50%; background:' + seg.color + '; display:inline-block; flex-shrink:0;' }, []),
          el('span', { style: 'color:var(--ink);' }, [seg.label + ': ']),
          el('b', {}, [String(seg.value)])
        ]);
      }));

    return el('div', { class: 'card' }, [
      el('h3', { style: 'margin:0 0 4px; font-size:14px;' }, [title]),
      subtitle ? el('p', { style: 'margin:0 0 14px; font-size:11px; color:var(--ink-soft);' }, [subtitle]) : null,
      total === 0
        ? el('p', { style: 'margin:0; font-size:11.5px; color:var(--ink-soft);' }, ['Sem dados ainda.'])
        : el('div', { style: 'display:flex; align-items:center; gap:24px; flex-wrap:wrap;' }, [svgWrap, legend])
    ]);
  }

  /** Lista em forma de gráfico de barras horizontal (barra proporcional ao
   * maior valor da lista) — mais fácil de escanear do que uma tabela de
   * número solto. */
  function barListCard_(title, subtitle, pares, opts) {
    opts = opts || {};
    var card = el('div', { class: 'card' }, [el('h3', { style: 'margin:0 0 4px; font-size:14px;' }, [title])]);
    if (opts.banner) card.appendChild(opts.banner);
    if (subtitle) card.appendChild(el('p', { style: 'margin:0 0 12px; font-size:11px; color:var(--ink-soft);' }, [subtitle]));
    if (pares.length === 0) {
      card.appendChild(el('p', { style: 'margin:0; font-size:11.5px; color:var(--ink-soft);' }, ['Nada por aqui ainda.']));
      return card;
    }
    var max = Math.max.apply(null, pares.map(function (p) { return p[1]; })) || 1;
    var bars = el('div', { style: subtitle ? '' : 'margin-top:4px;' });
    pares.forEach(function (par) {
      var pct = Math.max(6, Math.round((par[1] / max) * 100));
      var cor = opts.colorFor ? opts.colorFor(par[1]) : CHART_COLORS_.teal;
      var valorTexto = opts.formatValue ? opts.formatValue(par[1]) : String(par[1]);
      bars.appendChild(el('div', { style: 'margin-bottom:10px;' }, [
        el('div', { style: 'display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;' }, [
          el('span', { style: 'color:var(--ink);' }, [par[0]]),
          el('span', { style: 'font-weight:700; color:var(--ink);' }, [valorTexto])
        ]),
        el('div', { style: 'background:' + CHART_COLORS_.track + '; border-radius:6px; height:9px; overflow:hidden;' }, [
          el('div', { style: 'width:' + pct + '%; height:100%; background:' + cor + '; border-radius:6px;' }, [])
        ])
      ]));
    });
    card.appendChild(bars);
    return card;
  }

  function formatHoras_(horas) {
    if (horas < 1) return Math.round(horas * 60) + 'min';
    return horas.toFixed(1).replace('.', ',') + 'h';
  }

  function statCard_(label, value, accentColor) {
    return el('div', { class: 'card stat', style: accentColor ? 'border-left:4px solid ' + accentColor + ';' : '' }, [
      el('div', { class: 'value' }, [String(value)]), el('div', { class: 'label' }, [label])
    ]);
  }

  window.addEventListener('DOMContentLoaded', boot);
})();
</script>
