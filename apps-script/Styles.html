<style>
  :root{
    --paper:#f4f4f4; --paper-raised:#ffffff; --ink:#3c4a53; --ink-soft:#7c8891;
    --line:#e5e5e5; --line-soft:#efefef;
    --brand:#00afaa; --brand-ink:#008e87; --brand-strong:#007b75; --brand-tint:#e0f5f4; --on-brand:#ffffff;
    --pulse:#fba600; --pulse-tint:#fff1d9;
    --success:#00afaa; --success-ink:#007b75; --success-tint:#e0f5f4;
    --warning:#fba600; --warning-ink:#7a4d00; --warning-tint:#fff1d9;
    --critical:#d6483e; --critical-ink:#a83226; --critical-tint:#fbe4e1;
    --shadow: 0 1px 2px rgba(79,94,105,.07), 0 8px 24px -12px rgba(79,94,105,.2);
    --radius: 12px;
    --font: 'Segoe UI', Roboto, Arial, sans-serif;
    --font-mono: 'Consolas', 'SFMono-Regular', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font); font-size:14.5px; line-height:1.5;}
  h1,h2,h3{font-family:var(--font); letter-spacing:-.01em;}
  .mono{font-family:var(--font-mono);}
  button{font-family:inherit; cursor:pointer;}

  #topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px 22px; background:var(--brand-ink); color:#fff;
  }
  #topbar h1{margin:0; font-size:17px; font-weight:800;}
  #topbar .sub{font-size:12px; color:#d6f2ee; margin-top:2px;}
  .user-badge{font-size:12px; text-align:right; color:#eafffd;}
  .user-badge b{display:block; font-size:13px;}
  .role-pill{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    padding:2px 8px; border-radius:999px; background:var(--pulse); color:#4a2e00; margin-top:3px;
  }

  #tabs{display:flex; gap:4px; padding:10px 22px 0; background:var(--paper-raised); border-bottom:1px solid var(--line); flex-wrap:wrap;}
  #tabs button{
    border:0; background:transparent; padding:10px 14px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    border-bottom:2px solid transparent;
  }
  #tabs button.active{color:var(--brand-ink); border-bottom-color:var(--brand);}

  #view{padding:22px; max-width:1100px; margin:0 auto;}

  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px;}
  .grid-2{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start;}
  @media (max-width:900px){ .grid-2{grid-template-columns:1fr;} }

  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .pill.success{background:var(--success-tint); color:var(--success-ink);}
  .pill.warning{background:var(--warning-tint); color:var(--warning-ink);}
  .pill.critical{background:var(--critical-tint); color:var(--critical-ink);}
  .pill.neutral{background:var(--line-soft); color:var(--ink-soft);}
  .pill.brand{background:var(--brand-tint); color:var(--brand-ink);}

  .btn{border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); padding:8px 14px; border-radius:8px; font-size:13.5px; font-weight:600;}
  .btn:hover{border-color:var(--brand);}
  .btn.primary{background:var(--brand-strong); border-color:var(--brand-strong); color:#fff;}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--brand-ink);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  input[type=text], input[type=email], textarea, select{
    width:100%; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink);
    border-radius:8px; padding:8px 10px; font-size:13.5px; font-family:inherit;
  }
  label.field{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
  label.field > span{display:block; margin-bottom:3px;}

  .msg{max-width:80%; margin-bottom:12px; display:flex; flex-direction:column; gap:5px;}
  .msg.user{margin-left:auto; align-items:flex-end;}
  .bubble{padding:10px 13px; border-radius:12px; font-size:13.5px; line-height:1.5;}
  .msg.user .bubble{background:var(--brand-strong); color:#fff; border-bottom-right-radius:3px;}
  .msg.assistant .bubble{background:var(--line-soft); color:var(--ink); border-bottom-left-radius:3px;}

  /* Três pontinhos subindo e descendo em sequência, em vez de "Pensando..."
     parado — sem isso, uma resposta que demora alguns segundos (a
     reescrita via Gemini, quando configurada, tem essa latência de rede)
     dá a impressão de que travou. */
  .typing-dots{display:inline-flex; align-items:center; gap:4px; padding:2px 0;}
  .typing-dots span{
    width:6px; height:6px; border-radius:50%; background:var(--ink-soft);
    animation:typing-bounce 1.1s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes typing-bounce{
    0%, 80%, 100%{transform:translateY(0); opacity:.5;}
    40%{transform:translateY(-4px); opacity:1;}
  }

  /* Blocos cinza com um brilho passando por cima, no formato aproximado do
     que vai aparecer ali (linha de chamado, card de número) — em vez de um
     "Carregando..." parado (ou, pior, nada na tela, como acontecia no
     Dashboard) enquanto a lista/estatísticas ainda não chegaram. */
  .skeleton{
    border-radius:6px;
    background:linear-gradient(90deg, var(--line-soft) 25%, var(--line) 37%, var(--line-soft) 63%);
    background-size:400% 100%;
    animation:skeleton-shimmer 1.4s ease infinite;
  }
  @keyframes skeleton-shimmer{
    0%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .skeleton-row{display:flex; flex-direction:column; gap:8px;}
  .skeleton-stat{height:74px; border-radius:var(--radius);}

  /* padding/margin próprios (mais enxutos que o .card padrão) — e
     margin-bottom:0 porque o espaçamento entre cards já vem do gap
     do .stack que os envolve; manter os dois somava o dobro do espaço. */
  .ticket-row{display:flex; flex-direction:column; gap:6px; cursor:pointer; padding:12px 14px; margin-bottom:0;}
  .ticket-row:hover{border-color:var(--brand);}
  .ticket-row .top-line{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .ticket-row .subject{font-weight:700; font-size:14px;}
  .ticket-row .meta{font-size:11.5px; color:var(--ink-soft);}
  .ticket-row .meta b{color:var(--brand-ink);}
  .ticket-row.overdue{border-left:4px solid var(--critical); background:color-mix(in srgb, var(--critical) 12%, var(--paper-raised));}
  .ticket-row-footer{display:flex; align-items:center; justify-content:space-between; gap:10px;}

  .empty{padding:30px; text-align:center; color:var(--ink-soft);}
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center;}
  .chip{border:1px solid var(--line); background:var(--paper-raised); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--ink-soft);}
  .chip.active{background:var(--brand-strong); border-color:var(--brand-strong); color:#fff;}

  .composer{border:2px solid var(--brand-tint); border-radius:var(--radius); padding:12px; background:var(--paper-raised);}
  .composer.internal{border-color:var(--warning); background:var(--warning-tint);}
  .composer .mode-row{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
  .composer .mode-row button{border:0; background:var(--line-soft); padding:6px 12px; border-radius:7px; font-size:12px; font-weight:600; color:var(--ink-soft);}
  .composer .mode-row button.active{background:var(--paper-raised); box-shadow:var(--shadow); color:var(--ink);}

  .stack{display:flex; flex-direction:column; gap:10px;}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px;}
  @media (max-width:700px){ .stat-grid{grid-template-columns:1fr;} }
  .stat .value{font-size:26px; font-weight:800;}
  .stat .label{font-size:12px; color:var(--ink-soft);}
  .loading{color:var(--ink-soft); font-size:13px; padding:20px; text-align:center;}
</style>
