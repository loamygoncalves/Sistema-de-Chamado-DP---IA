name: CI/CD — BEEP AI Service Desk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.beepsaude.com.br
  IMAGE_BACKEND: beep-ai-service-desk/backend
  IMAGE_WORKER: beep-ai-service-desk/backend-worker
  IMAGE_FRONTEND: beep-ai-service-desk/frontend

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beep
          POSTGRES_PASSWORD: beep
          POSTGRES_DB: beep_service_desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beep" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes unitários
        env:
          DATABASE_URL: postgresql+asyncpg://beep:beep@localhost:5432/beep_service_desk_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret
        run: pytest -v

  frontend-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-and-push:
    needs: [backend-lint-test, frontend-lint-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push — backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — worker
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WORKER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_WORKER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar acesso ao cluster
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Atualizar imagens e aplicar manifests
        run: |
          kubectl apply -f infra/k8s/00-namespace.yaml
          kubectl apply -f infra/k8s/01-configmap.yaml
          kubectl set image deployment/beep-backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }} -n beep-ai-service-desk --dry-run=client -o yaml | kubectl apply -f -
          kubectl set image deployment/beep-worker worker=${{ env.REGISTRY }}/${{ env.IMAGE_WORKER }}:${{ github.sha }} -n beep-ai-service-desk --dry-run=client -o yaml | kubectl apply -f -
          kubectl set image deployment/beep-frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }} -n beep-ai-service-desk --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f infra/k8s/20-migrate-job.yaml --dry-run=client -o yaml | kubectl replace --force -f -
          kubectl wait --for=condition=complete job/beep-backend-migrate -n beep-ai-service-desk --timeout=300s
          kubectl apply -f infra/k8s/21-backend.yaml
          kubectl apply -f infra/k8s/22-worker.yaml
          kubectl apply -f infra/k8s/23-frontend.yaml
          kubectl apply -f infra/k8s/30-ingress.yaml
          kubectl rollout status deployment/beep-backend -n beep-ai-service-desk --timeout=300s
          kubectl rollout status deployment/beep-worker -n beep-ai-service-desk --timeout=300s
          kubectl rollout status deployment/beep-frontend -n beep-ai-service-desk --timeout=300s
